<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#facc15;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ca8a04;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded rectangle background -->
  <rect width="512" height="512" rx="80" fill="url(#goldGradient)"/>

  <!-- Waving hand emoji -->
  <text x="256" y="340" font-size="280" text-anchor="middle" fill="#1f2937">👋</text>

  <!-- Quu text -->
  <text x="256" y="450" font-size="72" font-weight="800" text-anchor="middle" fill="#1f2937" font-family="system-ui, -apple-system, sans-serif">Quu</text>
</svg>
