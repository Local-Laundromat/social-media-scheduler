<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>👋 Quu - Social Media Scheduler</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #facc15 0%, #ca8a04 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeIn 0.5s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .login-container {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      max-width: 400px;
      width: 100%;
      animation: slideUp 0.6s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo img {
      height: 80px;
      width: auto;
      margin-bottom: 16px;
      animation: gentlePulse 2s ease-in-out infinite;
    }

    @keyframes gentlePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    h1 {
      font-size: 24px;
      color: #1f2937;
      margin-bottom: 8px;
      text-align: center;
    }

    .subtitle {
      color: #6b7280;
      text-align: center;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-size: 15px;
      transition: all 0.3s ease;
      background: #fafafa;
    }

    .form-group input:hover {
      border-color: #d1d5db;
      background: white;
    }

    .form-group input:focus {
      outline: none;
      border-color: #fbbf24;
      background: white;
      box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.1);
      transform: translateY(-1px);
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 45px;
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      color: #9ca3af;
      transition: color 0.2s;
      font-size: 18px;
    }

    .toggle-password:hover {
      color: #6b7280;
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #facc15 0%, #ca8a04 100%);
      color: #1f2937;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 12px rgba(250, 204, 21, 0.3);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(250, 204, 21, 0.5);
    }

    .btn:active {
      transform: translateY(0);
    }

    .toggle-form {
      text-align: center;
      margin-top: 20px;
      color: #6b7280;
      font-size: 14px;
    }

    .toggle-form a {
      color: #f59e0b;
      text-decoration: none;
      font-weight: 600;
    }

    .toggle-form a:hover {
      text-decoration: underline;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }

    .success {
      background: #d1fae5;
      color: #065f46;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }

    .divider {
      text-align: center;
      margin: 30px 0;
      color: #9ca3af;
      font-size: 14px;
      position: relative;
    }

    .divider::before,
    .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 40%;
      height: 1px;
      background: #e5e7eb;
    }

    .divider::before {
      left: 0;
    }

    .divider::after {
      right: 0;
    }

    .integration-note {
      background: #fef3c7;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 13px;
      color: #78350f;
    }

    .integration-note strong {
      display: block;
      margin-bottom: 4px;
    }

    /* Forgot Password Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeIn 0.3s ease;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal-content {
      background: white;
      padding: 32px;
      border-radius: 16px;
      max-width: 450px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      animation: slideUp 0.4s ease-out;
    }

    .modal-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .modal-header h2 {
      font-size: 22px;
      color: #1f2937;
      margin-bottom: 8px;
    }

    .modal-header p {
      font-size: 14px;
      color: #6b7280;
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: none;
      border: none;
      font-size: 28px;
      color: #9ca3af;
      cursor: pointer;
      transition: color 0.2s;
      padding: 0;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-close:hover {
      color: #374151;
    }

    .modal-form .btn {
      margin-top: 8px;
    }

    .modal-content {
      position: relative;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">
      <img src="/logo.svg" alt="Quu">
      <h1 id="formTitle">Welcome Back</h1>
      <p class="subtitle">Queue. Post. Grow.</p>
    </div>


    <div id="errorMessage" class="error"></div>
    <div id="successMessage" class="success"></div>

    <form id="authForm">
      <div class="form-group" id="nameGroup" style="display: none;">
        <label>Full Name</label>
        <input type="text" id="name" placeholder="John Doe">
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="••••••••" required>
          <button type="button" class="toggle-password" id="togglePasswordBtn">
            <span id="eyeIcon">👁️</span>
          </button>
        </div>
      </div>

      <div class="form-group" id="companyGroup" style="display: none;">
        <label>Company Name (Optional)</label>
        <input type="text" id="company" placeholder="Your Company">
      </div>

      <!-- Team Selection (Signup Only) -->
      <div id="teamSection" style="display: none;">
        <div class="form-group">
          <label>Team Setup</label>
          <div style="display: flex; gap: 20px; margin-bottom: 16px;">
            <label style="display: flex; align-items: center; cursor: pointer; font-weight: 400;">
              <input type="radio" name="teamMode" value="create" id="createTeamRadio" checked style="width: auto; margin-right: 8px;">
              Create New Team
            </label>
            <label style="display: flex; align-items: center; cursor: pointer; font-weight: 400;">
              <input type="radio" name="teamMode" value="join" id="joinTeamRadio" style="width: auto; margin-right: 8px;">
              Join Existing Team
            </label>
          </div>
        </div>

        <div class="form-group" id="createTeamGroup">
          <label>Team Name</label>
          <input type="text" id="teamName" placeholder="Marketing Team">
        </div>

        <div class="form-group" id="joinTeamGroup" style="display: none;">
          <label>Team Invite Code</label>
          <input type="text" id="inviteCode" placeholder="A1B2C3D4E5F6" style="text-transform: uppercase;">
        </div>
      </div>

      <button type="submit" class="btn" id="submitBtn">Sign In</button>
    </form>

    <div class="toggle-form" style="display: none;">
      <span id="toggleText">Don't have an account?</span>
      <a href="#" id="toggleLink">Sign Up</a>
    </div>

    <div class="toggle-form">
      <div style="background: #fef3c7; padding: 12px 16px; border-radius: 8px; font-size: 13px; color: #78350f; text-align: left; line-height: 1.5;">
        <strong style="display: block; margin-bottom: 4px;">New Signups Coming Soon</strong>
        Existing users can continue to log in normally. Contact support for early access.
      </div>
    </div>

    <div class="toggle-form" id="forgotPasswordLink" style="margin-top: 10px;">
      <a href="#" id="forgotPasswordBtn" style="color: #6b7280; font-size: 13px;">Forgot password?</a>
    </div>
  </div>

  <!-- Forgot Password Modal -->
  <div class="modal-overlay" id="forgotPasswordModal">
    <div class="modal-content">
      <button class="modal-close" id="closeModal">×</button>
      <div class="modal-header">
        <h2>🔑 Reset Your Password</h2>
        <p>Enter your email and we'll send you a reset link</p>
      </div>
      <form id="forgotPasswordForm" class="modal-form">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="resetEmail" placeholder="you@example.com" required>
        </div>
        <div id="modalError" class="error"></div>
        <div id="modalSuccess" class="success"></div>
        <button type="submit" class="btn">Send Reset Link</button>
      </form>
    </div>
  </div>

  <script>
    let isSignUp = false;
    const form = document.getElementById('authForm');
    const formTitle = document.getElementById('formTitle');
    const submitBtn = document.getElementById('submitBtn');
    const toggleText = document.getElementById('toggleText');
    const toggleLink = document.getElementById('toggleLink');
    const nameGroup = document.getElementById('nameGroup');
    const companyGroup = document.getElementById('companyGroup');
    const teamSection = document.getElementById('teamSection');
    const createTeamGroup = document.getElementById('createTeamGroup');
    const joinTeamGroup = document.getElementById('joinTeamGroup');
    const createTeamRadio = document.getElementById('createTeamRadio');
    const joinTeamRadio = document.getElementById('joinTeamRadio');
    const errorMessage = document.getElementById('errorMessage');
    const successMessage = document.getElementById('successMessage');

    // Check if coming from integration (query params)
    const urlParams = new URLSearchParams(window.location.search);
    const returnUrl = urlParams.get('return_url');
    const stripeSessionId = urlParams.get('session_id');

    // If coming from Stripe checkout, enable signup mode
    if (stripeSessionId) {
      isSignUp = true;
      updateFormMode();
      // Show success message about payment
      showSuccess('Payment successful! Complete your account setup below.');
      // Hide the "signup coming soon" banner
      document.querySelectorAll('.toggle-form').forEach(el => {
        if (el.textContent.includes('New Signups Coming Soon')) {
          el.style.display = 'none';
        }
      });
    }

    // Toggle between sign in and sign up
    toggleLink.addEventListener('click', (e) => {
      e.preventDefault();
      isSignUp = !isSignUp;
      updateFormMode();
    });

    // Toggle between create team and join team
    createTeamRadio.addEventListener('change', () => {
      if (createTeamRadio.checked) {
        createTeamGroup.style.display = 'block';
        joinTeamGroup.style.display = 'none';
      }
    });

    joinTeamRadio.addEventListener('change', () => {
      if (joinTeamRadio.checked) {
        createTeamGroup.style.display = 'none';
        joinTeamGroup.style.display = 'block';
      }
    });

    function updateFormMode() {
      if (isSignUp) {
        formTitle.textContent = 'Create Account';
        submitBtn.textContent = 'Sign Up';
        toggleText.textContent = 'Already have an account?';
        toggleLink.textContent = 'Sign In';
        nameGroup.style.display = 'block';
        companyGroup.style.display = 'block';
        teamSection.style.display = 'block';
      } else {
        formTitle.textContent = 'Welcome Back';
        submitBtn.textContent = 'Sign In';
        toggleText.textContent = "Don't have an account?";
        toggleLink.textContent = 'Sign Up';
        nameGroup.style.display = 'none';
        companyGroup.style.display = 'none';
        teamSection.style.display = 'none';
      }
      hideMessages();
    }

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.style.display = 'block';
      successMessage.style.display = 'none';
    }

    function showSuccess(message) {
      successMessage.textContent = message;
      successMessage.style.display = 'block';
      errorMessage.style.display = 'none';
    }

    function hideMessages() {
      errorMessage.style.display = 'none';
      successMessage.style.display = 'none';
    }

    // Handle form submission
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMessages();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const name = document.getElementById('name').value;
      const company = document.getElementById('company').value;

      try {
        if (isSignUp) {
          // Prepare signup data with team info
          const signupData = { email, password, name, company };

          // Add Stripe session ID if coming from checkout
          if (stripeSessionId) {
            signupData.stripeSessionId = stripeSessionId;
          }

          // Add team creation or invite code
          const teamMode = document.querySelector('input[name="teamMode"]:checked').value;
          if (teamMode === 'create') {
            const teamName = document.getElementById('teamName').value.trim();
            if (!teamName) {
              showError('Please enter a team name');
              return;
            }
            signupData.teamName = teamName;
          } else {
            const inviteCode = document.getElementById('inviteCode').value.trim().toUpperCase();
            if (!inviteCode) {
              showError('Please enter an invite code');
              return;
            }
            signupData.inviteCode = inviteCode;
          }

          // Sign up
          const response = await fetch('/api/auth/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(signupData)
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || 'Sign up failed');
          }

          // Store token and user data
          const token = data.session?.access_token || data.token;
          if (!token) {
            showSuccess('Account created. Check your email to confirm your account, then sign in.');
            return;
          }
          localStorage.setItem('auth_token', token);
          localStorage.setItem('user', JSON.stringify(data.user));
          if (data.team) {
            localStorage.setItem('team', JSON.stringify(data.team));
          }

          // Redirect to dashboard
          if (returnUrl) {
            window.location.href = returnUrl;
          } else {
            window.location.href = '/dashboard';
          }
        } else {
          // Sign in
          const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || 'Login failed');
          }

          // Store token and user data
          const token = data.session?.access_token || data.token;
          if (!token) {
            showError('Signed in but no session was returned. Try again or confirm your email if signup required verification.');
            return;
          }
          localStorage.setItem('auth_token', token);
          localStorage.setItem('user', JSON.stringify(data.user));
          if (data.team) {
            localStorage.setItem('team', JSON.stringify(data.team));
          }

          // Redirect to dashboard
          window.location.href = '/dashboard';
        }
      } catch (error) {
        showError(error.message);
      }
    });

    // Forgot password modal management
    const forgotPasswordModal = document.getElementById('forgotPasswordModal');
    const closeModal = document.getElementById('closeModal');
    const forgotPasswordForm = document.getElementById('forgotPasswordForm');
    const modalError = document.getElementById('modalError');
    const modalSuccess = document.getElementById('modalSuccess');

    function showForgotPassword(e) {
      e.preventDefault();
      forgotPasswordModal.classList.add('show');
      document.getElementById('resetEmail').value = '';
      modalError.style.display = 'none';
      modalSuccess.style.display = 'none';
    }

    function closeForgotPasswordModal() {
      forgotPasswordModal.classList.remove('show');
    }

    closeModal.addEventListener('click', closeForgotPasswordModal);

    forgotPasswordModal.addEventListener('click', (e) => {
      if (e.target === forgotPasswordModal) {
        closeForgotPasswordModal();
      }
    });

    forgotPasswordForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      modalError.style.display = 'none';
      modalSuccess.style.display = 'none';

      const email = document.getElementById('resetEmail').value;

      try {
        const response = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        const data = await response.json();

        if (data.success) {
          modalSuccess.textContent = data.message;
          modalSuccess.style.display = 'block';
          setTimeout(() => {
            closeForgotPasswordModal();
          }, 3000);
        } else {
          modalError.textContent = data.error || 'Failed to send reset email';
          modalError.style.display = 'block';
        }
      } catch (error) {
        modalError.textContent = 'Failed to send reset email. Please try again.';
        modalError.style.display = 'block';
      }
    });

    // Toggle password visibility
    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eyeIcon');

      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.textContent = '👁️‍🗨️';
      } else {
        passwordInput.type = 'password';
        eyeIcon.textContent = '👁️';
      }
    }

    // Attach event listeners
    document.getElementById('togglePasswordBtn').addEventListener('click', togglePasswordVisibility);
    document.getElementById('forgotPasswordBtn').addEventListener('click', showForgotPassword);

    // Check if already logged in
    const authToken = localStorage.getItem('auth_token');
    if (authToken && authToken.length > 20) {
      // Clean the token (remove any whitespace)
      const cleanToken = authToken.trim();

      // Verify token is still valid
      fetch('/api/auth/verify', {
        headers: { 'Authorization': `Bearer ${cleanToken}` }
      })
      .then(res => res.json())
      .then(data => {
        if (data.valid) {
          window.location.href = '/dashboard';
        } else {
          localStorage.removeItem('auth_token');
          localStorage.removeItem('user');
          localStorage.removeItem('team');
        }
      })
      .catch(() => {
        localStorage.removeItem('auth_token');
        localStorage.removeItem('user');
        localStorage.removeItem('team');
      });
    } else if (authToken) {
      // Invalid token, clear it
      localStorage.removeItem('auth_token');
      localStorage.removeItem('user');
      localStorage.removeItem('team');
    }
  </script>
</body>
</html>
